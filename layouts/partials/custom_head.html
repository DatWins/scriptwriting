     <!-- Some variables to change

  --highlight-inverse:var(--cover-text-color);

-->
<style>
:root {
    /* see variables.scss for more variables*/
    

    --section-light-text-color:#f6f1e6;
    --section-light-bg-color:#232127;
    --section-dark-bg-color:#f6f1e6!important;
    --section-dark-text-color:#232127!important;

    --highlight:#e05a3a;
    --cover-text-color:#232127;
    --cover-title-and-description-guard-bg-color:rgba(246,241,230,.9);
    --cover-title-text-shadow:none;
    --footer-color-background:#141318;
    --sticky-menu-text-color:#f0714f;
    --single-page-bg-color:#f6f1e6;
    --single-page-text-color:#25222b;

     /* define list element for unnumbered lists, leave empty for default list element */
     /* fa-asterisk is the default icon if this variable definition is missing completely */
     --ul-li-icon: fa-dashcube;     /* this sets fa-dashcube as list icon */
     --ul-li-icon: ;                /* this sets the default html list icon */
}
/* cover arrow: gold so it shows on the dark cover */
#header-arrow, #header-arrow i { color: #f0714f !important; }
/* chess site: smaller project headings with space above them */
.post-content h2 { font-size: 1.45em; margin-top: 1.6em; }
.post-title { margin-bottom: 0.4em; }

/* ---------- phones & tablets ---------- */
@media only screen and (max-width: 1130px) {
  /* sticky menu: one row of large, easy-to-tap buttons that scrolls sideways */
  .fixed-nav {
    flex-wrap: nowrap !important; justify-content: flex-start; align-items: center; gap: 6px;
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    padding: 8px 10px !important; background: #232127 !important; box-shadow: 0 2px 8px rgba(0,0,0,.25);
    box-sizing: border-box;
  }
  .fixed-nav::-webkit-scrollbar { display: none; }
  a.fn-item {
    display: inline-block !important; flex: 0 0 auto; margin: 0 !important;
    padding: 9px 14px; border-radius: 999px; white-space: nowrap;
    font-size: 15px; line-height: 1.2; letter-spacing: .02em;
    color: #f6f1e6 !important; background: rgba(255,255,255,.12); opacity: .9;
  }
  a.fn-item.active { background: #e05a3a; color: #141318 !important; opacity: 1; }
  .post-holder .post { scroll-margin-top: 64px; }

  /* cover: menu buttons big enough for a thumb */
  #site-head .btn.site-menu { padding: 10px 16px; margin: 5px 3px; font-size: 15px; }
  #site-head .blog-title { font-size: 3.4rem; }
  #site-head .blog-description { font-size: 1.9rem; }

  /* links in the sections become proper tap targets */
  .post-content ul { padding-left: 0; list-style: none; }
  .post-content li { margin: .6em 0; }
  .post-content li a {
    display: inline-block; padding: 9px 16px; margin: 3px 6px 3px 0;
    border: 1.5px solid currentColor; border-radius: 10px; text-decoration: none; line-height: 1.3;
  }
  .post-content h2 { font-size: 1.3em; overflow-wrap: anywhere; }
  .post-content { overflow-wrap: break-word; }
}

</style>
<script>
/* keep the highlighted menu button visible in the sideways-scrolling phone menu */
document.addEventListener('DOMContentLoaded', function () {
  var nav = document.querySelector('.fixed-nav'); if (!nav) return; var last = null;
  window.addEventListener('scroll', function () {
    var a = nav.querySelector('.fn-item.active'); if (!a || a === last || nav.scrollWidth <= nav.clientWidth) return; last = a;
    nav.scrollTo({ left: a.offsetLeft - (nav.clientWidth - a.offsetWidth) / 2, behavior: 'smooth' });
  }, { passive: true });
});
</script>
